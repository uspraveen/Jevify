[project]
name = "jevify"
version = "0.0.1"
description = "Turn any open LLM into a calibrated System One decision model (choice / score / noul)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Praveen Raj U S" }]
dependencies = ["pydantic>=2.5", "httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
bench = ["datasets>=3.0", "huggingface_hub>=0.25", "pandas>=2.0", "pyarrow>=15", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
jevify-bench = "jevify.bench.build:main"
jevify-run = "jevify.runners.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jevify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
